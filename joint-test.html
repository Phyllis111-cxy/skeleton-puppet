<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Skeleton Puppet · Joint Test</title><script type="importmap">{"imports":{"three":"./vendor/three.module.js"}}</script><style>body{margin:0;background:#120d20;color:#f3e9d8;font:14px Arial,sans-serif}#view{position:fixed;inset:0 320px 0 0}aside{position:fixed;right:0;top:0;bottom:0;width:320px;padding:18px;overflow:auto;background:#21172c}h1{font-size:18px}label{display:block;margin:14px 0}input,select{width:100%}p{line-height:1.5;color:#dbc8c6}#joint-presets{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}#joint-presets button{font-size:11px;padding:6px 2px}button{background:#f2a451;border:0;border-radius:4px;padding:9px 14px;cursor:pointer}#status{color:#ffca88}#joints{height:180px}small{color:#b8a8b2}@media(max-width:700px){#view{inset:0 0 230px 0}aside{top:auto;left:0;right:0;bottom:0;width:auto;height:230px;padding:10px}h1{margin:0 0 4px}aside p{display:none}#joints{height:100px}label{margin:6px 0}} </style></head><body><div id="view"></div><aside><h1>Skeleton Joint Test</h1><p>Test each pull point. Joints should move together and settle when released.</p><div id="pull-tests"></div><div id="joint-presets" aria-label="Individual joint tests"></div><input id="file" type="file" accept=".glb,.gltf"><p id="status">Loading original glTF…</p><small id="stats"></small><label>Joint nodes<select id="joints" size="12"></select></label><label>X angle<input id="x" type="range" min="-90" max="90" value="0"></label><label>Y angle<input id="y" type="range" min="-90" max="90" value="0"></label><label>Z angle<input id="z" type="range" min="-90" max="90" value="0"></label><button id="reset">Reset pose</button></aside><script type="module" src="joint-test.js"></script></body></html>
